name: Notify MCP server to pull latest codex

# Fires on every push to a tracked branch and on manual dispatch. The job is
# scoped to a GitHub Environment matching the branch — secrets are pulled
# from that environment only, so the job can never see another env's URL/key.
#
# Branch → environment mapping:
#   main    → prod
#   alpha   → alpha
#   pirates → pirates
#   sigma   → sigma
#   staging → staging
#
# Each GitHub Environment must hold these two secrets:
#   SYNC_URL - MCP /admin/codex-sync endpoint for that environment
#   SYNC_KEY - Sync key (must match CODEX_SYNC_KEY on the matching MCP server)

on:
  push:
    branches: [main, alpha, pirates, sigma, staging]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: POST sync trigger to MCP server
        env:
          BRANCH: ${{ github.ref_name }}
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ] || [ -z "${SYNC_KEY:-}" ]; then
            echo "::error::SYNC_URL or SYNC_KEY not set in the environment scoped for branch '$BRANCH'" >&2
            exit 1
          fi
          BODY=$(jq -nc \
            --arg event "push" \
            --arg ref "${GITHUB_REF}" \
            --arg sha "${GITHUB_SHA}" \
            '{event:$event, ref:$ref, sha:$sha}')
          STATUS=$(curl -sS -o /tmp/sync_response.txt -w '%{http_code}' \
            -X POST "$SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "X-GB-Sync-Key: $SYNC_KEY" \
            --data "$BODY")
          echo "MCP server (branch=$BRANCH) responded $STATUS"
          cat /tmp/sync_response.txt || true
          if [ "$STATUS" != "202" ]; then
            echo "::error::Expected 202 from $BRANCH MCP, got $STATUS" >&2
            exit 1
          fi
